<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>샬롬찬송가 - 통일찬송가 558곡 전곡</title>
    <meta name="description" content="통일찬송가 558곡 전곡 수록, 초성 검색 및 가사 검색 지원 모바일 찬송가 앱">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="샬롬찬송가 - 558곡 전곡">
    <meta property="og:description" content="언제 어디서나 편리하게 찾는 통일찬송가. 초성 검색과 가사 검색을 지원합니다.">
    <meta property="og:image" content="images/001.gif"> <!-- 1장 이미지를 대표 이미지로 사용 -->
    
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#1a1a1a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div id="app">
        
        <!-- 통합 상단 헤더 -->
        <header class="app-header glass">
            <div class="top-row">
                <button id="menuBtn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <button id="backBtn" class="icon-btn hidden">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
                <h1 id="mainTitle">샬롬찬송가</h1>
                <button id="universalFavBtn" class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                </button>
            </div>
            <div class="search-row">
                <div class="search-container">
                    <input type="text" id="mainSearchInput" placeholder="번호, 제목 검색" autocomplete="off">
                    <button id="newHymnToggle" class="lyrics-toggle">신</button>
                    <button id="mainLyricsToggle" class="lyrics-toggle">가사 포함</button>
                </div>
            </div>
            <div id="searchResults" class="search-results hidden"></div>
        </header>

        <!-- 홈 화면 -->
        <section id="homeView" class="view">
            <div class="list-container">
                <div id="hymnList" class="hymn-list"></div>
            </div>
            <!-- 우측 빠른 스크롤 인덱스 바 추가 -->
            <div class="fast-scroll-index">
                <div class="index-item" data-target="1">1</div>
                <div class="index-item" data-target="50">50</div>
                <div class="index-item" data-target="100">100</div>
                <div class="index-item" data-target="150">150</div>
                <div class="index-item" data-target="200">200</div>
                <div class="index-item" data-target="250">250</div>
                <div class="index-item" data-target="300">300</div>
                <div class="index-item" data-target="350">350</div>
                <div class="index-item" data-target="400">400</div>
                <div class="index-item" data-target="450">450</div>
                <div class="index-item" data-target="500">500</div>
                <div class="index-item" data-target="550">550</div>
            </div>
        </section>

        <!-- 뷰어 화면 -->
        <section id="viewerView" class="view hidden">
            <main id="viewerBody">
                <div id="scoreContainer" class="score-container">
                    <div id="imageCanvas"></div>
                </div>
            </main>

            <!-- 조바꿈 팝업 (삭제됨 - 푸터로 이동) -->

            <footer class="viewer-footer">
                <button id="prevBtn" class="footer-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <!-- 메트로놈 영역 (버튼 + 외부 LED 표시등) -->
                <div class="metro-container">
                    <button id="metroBtn" class="footer-icon metro-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18">
                            <path fill="currentColor" d="M12 3l8 2v12c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3c.35 0 .69.06 1 .17V7.8l-6-.75v9.5c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3c.35 0 .69.06 1 .17V3h6z"/>
                        </svg>
                        <span id="metroBpmText">: 100</span>
                    </button>
                    <span id="metroLed" class="metro-led"></span>
                </div>

                <button id="nextBtn" class="footer-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </footer>
        </section>

        <!-- 설정 사이드바 -->
        <div id="settingsSidebar" class="sidebar">
            <div class="sidebar-inner">
                <div class="sidebar-header">
                    <h2>설정</h2>
                    <button id="closeSettings">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
                <div class="settings-content">
                    <div class="setting-item">
                        <span class="label">다크 모드</span>
                        <label class="switch">
                            <input type="checkbox" id="darkModeToggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="setting-item">
                        <span class="label">메트로놈 비주얼 큐</span>
                        <label class="switch">
                            <input type="checkbox" id="metroVisualToggle" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div id="sidebarOverlay" class="overlay hidden"></div>
    </div>

    <script src="hymns.js"></script>
    <script src="app.js"></script>
</body>
</html>
